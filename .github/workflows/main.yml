name: CyberBrief Daily Update

on:
  schedule:
    - cron: '0 6,10,14,18 * * *'
  workflow_dispatch:

jobs:
  update-brief:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -q requests feedparser beautifulsoup4
      
      - name: Run CyberBrief scraper
        run: python scraper.py
      
      - name: Configure Git
        run: |
          git config --global user.email "cyberbrief-bot@secops-dctx.gov"
          git config --global user.name "CyberBrief Bot"
      
      - name: Commit and push updates
        run: |
          git add data.json
          git commit -m "CyberBrief daily update — $(date +%Y-%m-%d\ %H:%M)" || true
          git push origin main || true
      
      - name: Log workflow completion
        run: echo "CyberBrief update completed at $(date)"
