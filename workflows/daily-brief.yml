name: CyberBrief Daily Update

on:
  schedule:
    # 7am CST = 1pm UTC (CST is UTC-6, CDT is UTC-5)
    # Using UTC time: 13:00 UTC = 7am CST (during standard time)
    # Note: During CDT (daylight saving), adjust to 12:00 UTC for 7am CDT
    - cron: '0 13 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-brief:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4
      
      - name: Run CyberBrief scraper
        run: |
          python scraper.py
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CyberBrief Bot"
      
      - name: Commit and push changes
        run: |
          git add data.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "CyberBrief daily update — $(date +%Y-%m-%d)" && git push
          )
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        run: echo "CyberBrief daily update failed. Check logs for details."
